# Publica la imagen todo-en-uno en GHCR, para amd64 y arm64.
name: Imagen Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRO: ghcr.io
  # `github.repository` conserva mayúsculas y Docker exige minúsculas.
  IMAGEN: ""

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Un fallo de sintaxis aquí no se vería hasta el primer `docker run`.
      - name: Comprobar el script de arranque
        run: bash -n docker/arranque.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRO }}/${{ env.IMAGEN }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.todo-en-uno
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Que compile no es que levante. Solo amd64: el runner no mueve arm64.
      - name: Probar que arranca
        run: |
          docker volume create prueba-datos
          docker run -d --name prueba -v prueba-datos:/data \
            -p 8000:8000 ${{ env.REGISTRO }}/${{ env.IMAGEN }}:latest
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "/health responde"; exit 0
            fi
            # Sin credenciales /health da 503, y es correcto: se comprueba que sirve.
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health | grep -q 503; then
              echo "/health responde 503, esperado sin credenciales"; exit 0
            fi
            sleep 3
          done
          echo "no respondió en 3 minutos"; docker logs prueba; exit 1

      - name: Comprobar que se niega a arrancar sin volumen
        # Sin volumen, la serie de precios se pierde al recrear el contenedor.
        run: |
          if docker run --rm ${{ env.REGISTRO }}/${{ env.IMAGEN }}:latest 2>&1 | grep -q "no está montado"; then
            echo "se niega a arrancar sin volumen"
          else
            echo "arrancó sin volumen: la guarda no funciona"; exit 1
          fi
